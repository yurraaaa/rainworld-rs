name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p rainworld-rs
      - name: Package
        run: |
          name="rainworld-rs-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/rainworld-rs LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          id=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for f in "$ARCHIVE" "$ARCHIVE.sha256"; do
            curl -fsS -X POST "$API/releases/$id/assets?name=$f" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$f"
          done
