[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rw-sim = { path = "crates/sim" }
rw-assets = { path = "crates/assets" }
rw-render = { path = "crates/render" }
rw-graphics = { path = "crates/graphics" }
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl", "std"] }
winit = "0.30.13"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
png = "0.18"

# Dependencies (png, wgpu) are far too slow unoptimised; our own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
